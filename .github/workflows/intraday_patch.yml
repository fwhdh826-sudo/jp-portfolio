name: v13.3 Intraday Patch

# schedule is intended for main after merge.
# On v13.3-dev, use workflow_dispatch for manual verification only.
on:
  schedule:
    # 毎週月〜金 12:30 JST (= 03:30 UTC)
    # 東証昼休み帯 (11:30〜12:30 JST) の後半に Tier 1 ソースを更新する
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: intraday-patch
  cancel-in-progress: false  # 実行中の更新を後続 run から保護する

jobs:
  # ── Tier 1 軽量更新（市場 + ニュースのみ）────────────────────────────────
  # pytest は実行しない（速度優先、Tier 1 更新のみ）
  patch-tier1:
    name: Patch Tier 1 Data (market + news)
    runs-on: ubuntu-latest
    concurrency:
      group: jp-portfolio-production-data-mutation
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Evaluate scheduled safe-start admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m backend.engine.operation.late_run_guard --workflow intraday
          # Re-anchor to latest remote tip only after OPS-R2 admission succeeds.
          python3 -m backend.engine.operation.ref_reanchor_gate

      - name: Evaluate mutation admission (pre_fetch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m backend.engine.operation.mutation_admission
          --workflow intraday --checkpoint pre_fetch

      - name: Install Python deps
        run: pip install yfinance pandas numpy feedparser

      # ── Tier 1 ソースのみ更新 ─────────────────────────────────────────
      - name: Update market.json (Tier 1 / max_age 30min)
        run: python3 data/update_market.py || true

      - name: Collect news (Tier 1 / max_age 30min)
        # P4.5-A006: DEEPL_API_KEY未設定でもtranslate_to_ja()は安全にNoneへfallbackする
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python3 data/update_news.py || true

      # ── public/data へコピー（Tier 1 のみ）──────────────────────────
      - name: Copy Tier 1 JSON to public/data
        run: |
          for f in market news; do
            if [ -f "data/${f}.json" ]; then
              cp "data/${f}.json" "public/data/${f}.json"
            fi
          done

      - name: Build candidates news summary
        run: python3 data/build_candidates_news.py || true

      - name: Evaluate mutation admission (pre_publish)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m backend.engine.operation.mutation_admission
          --workflow intraday --checkpoint pre_publish

      # ── git push ──────────────────────────────────────────────────────
      - name: Commit and push
        id: commit-push
        run: |
          set -euo pipefail

          echo "data_changed=false" >> "$GITHUB_OUTPUT"

          target_branch="${GITHUB_REF_NAME:?GITHUB_REF_NAME is required}"
          target_ref="${GITHUB_REF:?GITHUB_REF is required}"
          target_ref_type="${GITHUB_REF_TYPE:?GITHUB_REF_TYPE is required}"

          if [ "$target_ref_type" != "branch" ]; then
            echo "::error::Refusing data push for non-branch ref: $target_ref" >&2
            exit 1
          fi
          if [ "$target_ref" != "refs/heads/$target_branch" ]; then
            echo "::error::Ref name does not match branch ref: $target_ref" >&2
            exit 1
          fi
          if ! git check-ref-format --branch "$target_branch" >/dev/null 2>&1; then
            echo "::error::Invalid target branch name" >&2
            exit 1
          fi
          if ! checked_out_branch="$(git symbolic-ref --quiet --short HEAD)"; then
            echo "::error::Refusing data push from detached HEAD" >&2
            exit 1
          fi
          if [ "$checked_out_branch" != "$target_branch" ]; then
            echo "::error::Checked-out branch does not match workflow ref" >&2
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Release history: forward-only. The base is bound from the (already
          # re-anchored) local HEAD before any data commit is created.
          push_base_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "$push_base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot bind the push base commit" >&2
            exit 1
          fi
          git add data/market.json data/news.json data/candidates_news.json public/data/market.json public/data/news.json public/data/candidates_news.json
          # Every staged delta must modify an existing regular strict-JSON data file.
          python3 - <<'PY'
          import json
          import math
          import subprocess
          import sys

          ALLOWED = frozenset((
              "data/candidate_funnel.json",
              "data/candidates_news.json",
              "data/candidates_stocks.json",
              "data/correlation.json",
              "data/earnings_calendar.json",
              "data/flows.json",
              "data/macro.json",
              "data/margin.json",
              "data/market.json",
              "data/news.json",
              "data/regime_state.json",
              "data/safe_mode.json",
              "data/sq_calendar.json",
              "data/tier_a_alerts.json",
              "data/tier_a_violations.json",
              "public/data/candidate_funnel.json",
              "public/data/candidates_news.json",
              "public/data/candidates_stocks.json",
              "public/data/correlation.json",
              "public/data/earnings_calendar.json",
              "public/data/flows.json",
              "public/data/holding_evidence.json",
              "public/data/macro.json",
              "public/data/margin.json",
              "public/data/market.json",
              "public/data/market_intel.json",
              "public/data/news.json",
              "public/data/regime_state.json",
              "public/data/returns.json",
              "public/data/safe_mode.json",
              "public/data/scoring/stock_scores_6axis.json",
              "public/data/sq_calendar.json",
              "public/data/tier_a_alerts.json",
              "public/data/tier_a_violations.json",
          ))


          def fail(message):
              print("::error::" + message, file=sys.stderr)
              sys.exit(1)


          def git_bytes(*args):
              return subprocess.run(("git",) + args, check=True, stdout=subprocess.PIPE).stdout


          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate key")
                  result[key] = value
              return result


          def reject_nonfinite(_token):
              raise ValueError("nonfinite number")


          def finite_float(token):
              value = float(token)
              if not math.isfinite(value):
                  raise ValueError("nonfinite number")
              return value


          fields = git_bytes("diff", "--cached", "--raw", "--no-renames", "--no-abbrev", "-z").split(b"\0")
          if fields and fields[-1] == b"":
              fields.pop()
          if len(fields) % 2 != 0:
              fail("Unparseable staged change list")
          for meta, raw_path in zip(fields[0::2], fields[1::2]):
              try:
                  parts = meta.decode("ascii").split(" ")
                  path = raw_path.decode("utf-8")
              except UnicodeDecodeError:
                  fail("Unparseable staged change entry")
              if len(parts) != 5 or not parts[0].startswith(":"):
                  fail("Unparseable staged change entry")
              source_mode, target_mode, blob_id, status = parts[0][1:], parts[1], parts[3], parts[4]
              if status != "M" or source_mode != "100644" or target_mode != "100644":
                  fail("Staged change is not a modification of an existing regular file: " + path)
              if path not in ALLOWED:
                  fail("Staged path is not an eligible data file: " + path)
              try:
                  json.loads(
                      git_bytes("cat-file", "blob", blob_id).decode("utf-8"),
                      object_pairs_hook=reject_duplicate_keys,
                      parse_constant=reject_nonfinite,
                      parse_float=finite_float,
                  )
              except (UnicodeDecodeError, ValueError, RecursionError):
                  fail("Staged data file is not strict UTF-8 JSON: " + path)
          PY
          data_changed=false
          if ! git diff --staged --quiet; then
            git commit -m "chore: intraday-patch $(date +'%Y-%m-%d %H:%M JST')"
            data_changed=true
          fi
          git diff --quiet || {
            echo "::error::Unstaged tracked changes remain after intraday staging"
            git status --short
            exit 1
          }
          proposed_push_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "$proposed_push_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot bind the proposed push commit" >&2
            exit 1
          fi
          if [ "$data_changed" = "true" ]; then
            proposed_parents="$(git rev-list --parents -n 1 "$proposed_push_sha")"
            if [ "$proposed_parents" != "$proposed_push_sha $push_base_sha" ]; then
              echo "::error::Data commit is not a single child of the push base" >&2
              exit 1
            fi
          elif [ "$proposed_push_sha" != "$push_base_sha" ]; then
            echo "::error::Local HEAD moved without a data commit" >&2
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Tracked changes remain after data staging" >&2
            git status --short >&2
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Unexpected untracked files remain after data staging" >&2
            git status --short >&2
            exit 1
          fi

          # The remote target must still be exactly the bound base; it is never merged
          # or fast-forwarded into the generated data commit.
          git fetch --no-tags origin "$target_ref"
          fetched_tip="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          if [[ ! "$fetched_tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot resolve the fetched remote target" >&2
            exit 1
          fi
          if [ "$fetched_tip" != "$push_base_sha" ]; then
            echo "::error::Remote target no longer matches the push base" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$fetched_tip" "$proposed_push_sha"; then
            echo "::error::Fetched remote target is not an ancestor of the proposed push" >&2
            exit 1
          fi

          git push origin "HEAD:$target_ref"

          # Success is only reported after the remote target is independently observed.
          if ! observed_remote="$(git ls-remote --exit-code --refs origin "$target_ref")"; then
            echo "::error::PUSH_OUTCOME_UNCONFIRMED: remote target could not be observed" >&2
            exit 1
          fi
          if [[ "$observed_remote" == *$'\n'* ]]; then
            echo "::error::PUSH_OUTCOME_UNCONFIRMED: ambiguous remote target observation" >&2
            exit 1
          fi
          IFS=$'\t' read -r observed_sha observed_ref observed_extra <<< "$observed_remote"
          if [ "$observed_ref" != "$target_ref" ] || [ -n "$observed_extra" ] || [ "$observed_sha" != "$proposed_push_sha" ]; then
            echo "::error::PUSH_OUTCOME_UNCONFIRMED: remote target does not match the pushed commit" >&2
            exit 1
          fi

          if [ "$data_changed" = "true" ]; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "pushed_sha=$proposed_push_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Pages for pushed data
        if: ${{ steps.commit-push.outputs.data_changed == 'true' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED_SHA: ${{ steps.commit-push.outputs.pushed_sha }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF:?GITHUB_REF is required}" != "refs/heads/main" ]; then
            echo "::error::Refusing production Pages dispatch outside main" >&2
            exit 1
          fi
          if [[ ! "$PUSHED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing Pages dispatch without an exact pushed SHA" >&2
            exit 1
          fi

          gh workflow run deploy.yml \
            --repo "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}" \
            --ref main \
            -f "deploy_sha=$PUSHED_SHA"

      # NOTE: pytest は実行しない（軽量更新優先）。health gate は full_batch.yml の責務。
      # NOTE: Discord 通知は Card 2-4 の責務。ここでは実装しない。
      # NOTE: recovery_log 書き込みは Card 2-4 の責務。ここでは実装しない。
      # NOTE: SAFE_MODE 実発動は行わない。判定のみ (safe_mode.py)。
      # NOTE: 自動売買・証券API接続は一切行わない。
      # NOTE: npm build は deploy.yml の責務。ここでは実行しない。
