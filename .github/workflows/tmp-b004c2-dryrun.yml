name: TEMP B004c-2 Dry-Run (read-only, remove after use)

# TEMPORARY workflow for P5-B004c-2-ACTIONS-DRY-RUN. Registered on the
# default branch only so workflow_dispatch can be invoked via API/CLI,
# then reverted from both main and v13.3-dev once the dry-run is done.
#
# Read-only: does not touch data/.jpx_cache/, does not write to
# public/data, does not modify candidates_stocks.json, does not commit,
# does not connect default_universe_provider to JPX/pre-screen.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dryrun:
    name: dry-run batch_size=${{ matrix.batch_size }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        batch_size: [400, 200, 100]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install yfinance pandas numpy requests xlrd

      - name: Run B004c-2 dry-run (read-only, temp cache paths)
        env:
          DRYRUN_BATCH_SIZE: ${{ matrix.batch_size }}
        run: python3 scripts/tmp_b004c2_dryrun.py

      - name: Confirm no repo writes occurred
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: dry-run left working tree dirty" >&2
            git status
            exit 1
          fi
          echo "OK: working tree clean after dry-run"
